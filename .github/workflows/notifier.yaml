name: Internship Notifier

on:
  schedule:
    # Every day at 9:00 AM Eastern
    - cron: "0 13 * * *"

  # Manually run it from GitHub while testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internship notifier
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python main.py 2>&1 | tee run.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifier-log
          path: run.log

      - name: Commit updated seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/seen_jobs.json

          if git diff --cached --quiet; then
            echo "No changes to seen_jobs.json"
          else
            git commit -m "Update seen jobs"
            git push
          fi